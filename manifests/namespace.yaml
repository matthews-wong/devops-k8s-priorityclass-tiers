apiVersion: v1
kind: Namespace
metadata:
  name: tiers-demo
  labels:
    app.kubernetes.io/name: tiers-demo
    app.kubernetes.io/part-of: priorityclass-tiers
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.31
---
# Caps how much the batch tier can hold, so a runaway CronJob cannot starve
# the namespace even though it never preempts anyone.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: batch-low-quota
  namespace: tiers-demo
  labels:
    app.kubernetes.io/name: batch-low-quota
    app.kubernetes.io/part-of: priorityclass-tiers
spec:
  hard:
    pods: "10"
    requests.cpu: "2"
    requests.memory: 2Gi
    limits.cpu: "4"
    limits.memory: 4Gi
  scopeSelector:
    matchExpressions:
      - scopeName: PriorityClass
        operator: In
        values:
          - batch-low
